packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAgeExclude:
  - "@next/env@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
# esbuild (lo usa drizzle-kit) trae su binario como dependencia opcional; su
# script de instalación solo lo verifica, así que no hace falta ejecutarlo.
allowBuilds:
  esbuild: false
